steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/ensayo1-494921/gym-repo/gym-frontend:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/ensayo1-494921/gym-repo/gym-frontend:latest

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - gym-frontend
      - --image=us-central1-docker.pkg.dev/ensayo1-494921/gym-repo/gym-frontend:latest
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated

images:
  - us-central1-docker.pkg.dev/ensayo1-494921/gym-repo/gym-frontend:latest
