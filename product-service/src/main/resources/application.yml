server:
  port: ${PORT:8080}

spring:
  application:
    name: product-service

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:gym_product_db}?schema=${DB_SCHEMA:product}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  flyway:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:gym_product_db}
    user: ${DB_USER}
    password: ${DB_PASSWORD}
    locations: classpath:db/migration
    schemas: ${DB_SCHEMA:product}
    default-schema: ${DB_SCHEMA:product}
    create-schemas: true
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:product-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    listener:
      ack-mode: record
      concurrency: 1

  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.apache.kafka: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

security:
  jwt:
    secret: ${JWT_SECRET}

app:
  kafka:
    topics:
      category-events: ${KAFKA_CATEGORY_TOPIC:category.events}
      product-events: ${KAFKA_PRODUCT_TOPIC:product.events}