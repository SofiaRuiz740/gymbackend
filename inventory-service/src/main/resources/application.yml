server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: inventory-service
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gym_inventory_db}?schema=${DB_SCHEMA:inventory}
    username: ${DB_USER:gym}
    password: ${DB_PASSWORD:gym}
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gym_inventory_db}
    user: ${DB_USER:gym}
    password: ${DB_PASSWORD:gym}
    locations: classpath:db/migration
    schemas: ${DB_SCHEMA:inventory}
    default-schema: ${DB_SCHEMA:inventory}
    create-schemas: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:inventory-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.gym.shared.events
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

security:
  jwt:
    secret: ${JWT_SECRET:replace-this-with-a-very-strong-secret-32-bytes}

app:
  kafka:
    topics:
      product-events: ${KAFKA_PRODUCT_TOPIC:product.events}
      inventory-movements: ${KAFKA_INVENTORY_TOPIC:inventory.movements}
