server:
  port: ${PORT:8080}

spring:
  application:
    name: user-service

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:gym_user_db}?schema=${DB_SCHEMA:identity}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  flyway:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:gym_user_db}
    user: ${DB_USER}
    password: ${DB_PASSWORD}
    locations: classpath:db/migration
    schemas: ${DB_SCHEMA:identity}
    default-schema: ${DB_SCHEMA:identity}
    create-schemas: true
    baseline-on-migrate: true

  # 🔥 IMPORTANTE: este servicio NO usa Kafka
  # 👉 mejor no configurarlo en absoluto (más limpio y profesional)

  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.apache.kafka: OFF   # opcional, por si alguna dependencia lo trae

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:gym-inventory}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}

app:
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME}
    email: ${BOOTSTRAP_ADMIN_EMAIL}
    password: ${BOOTSTRAP_ADMIN_PASSWORD}