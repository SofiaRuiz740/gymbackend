server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: user-service
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gym_user_db}?schema=${DB_SCHEMA:identity}
    username: ${DB_USER:gym}
    password: ${DB_PASSWORD:gym}
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gym_user_db}
    user: ${DB_USER:gym}
    password: ${DB_PASSWORD:gym}
    locations: classpath:db/migration
    schemas: ${DB_SCHEMA:identity}
    default-schema: ${DB_SCHEMA:identity}
    create-schemas: true
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

security:
  jwt:
    secret: ${JWT_SECRET:replace-this-with-a-very-strong-secret-32-bytes}
    issuer: ${JWT_ISSUER:gym-inventory}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}

app:
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@gym.local}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin123!}

