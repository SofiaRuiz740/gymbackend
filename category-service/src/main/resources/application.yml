server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: category-service
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gym_category_db}?schema=${DB_SCHEMA:catalog}
    username: ${DB_USER:gym}
    password: ${DB_PASSWORD:gym}
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gym_category_db}
    user: ${DB_USER:gym}
    password: ${DB_PASSWORD:gym}
    locations: classpath:db/migration
    schemas: ${DB_SCHEMA:catalog}
    default-schema: ${DB_SCHEMA:catalog}
    create-schemas: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

security:
  jwt:
    secret: ${JWT_SECRET:replace-this-with-a-very-strong-secret-32-bytes}

app:
  kafka:
    topics:
      category-events: ${KAFKA_CATEGORY_TOPIC:category.events}
