apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: gym-inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: us-central1-docker.pkg.dev/gym-inventory-platform/gym-backend/user-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_NAME
              value: gym_user_db
            - name: DB_SCHEMA
              value: identity
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secret

          # 🔥 FIX DEFINITIVO
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: gym-inventory
spec:
  selector:
    app: user-service
  ports:
    - port: 8080
      targetPort: 8080