apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: gym-inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: gym/user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: DB_NAME
              value: gym_user_db
            - name: DB_SCHEMA
              value: identity
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 25
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: gym-inventory
spec:
  selector:
    app: user-service
  ports:
    - port: 8081
      targetPort: 8081

