apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-service
  namespace: gym-inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-service
  template:
    metadata:
      labels:
        app: report-service
    spec:
      containers:
        - name: report-service
          image: gym/report-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          env:
            - name: DB_NAME
              value: gym_report_db
            - name: DB_SCHEMA
              value: reporting
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 25
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: report-service
  namespace: gym-inventory
spec:
  selector:
    app: report-service
  ports:
    - port: 8085
      targetPort: 8085

