apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: gym-inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: us-central1-docker.pkg.dev/gym-inventory-platform/gym-backend/inventory-service:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080   # 🔥 CORREGIDO
          env:
            - name: DB_NAME
              value: gym_inventory_db
            - name: DB_SCHEMA
              value: inventory
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secret

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080   # 🔥 CORREGIDO
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080   # 🔥 CORREGIDO
            initialDelaySeconds: 90
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: gym-inventory
spec:
  selector:
    app: inventory-service
  ports:
    - port: 8080        # 🔥 CORREGIDO
      targetPort: 8080  # 🔥 CORREGIDO