apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: gym-inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: gym/product-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: DB_NAME
              value: gym_product_db
            - name: DB_SCHEMA
              value: product
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 25
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: gym-inventory
spec:
  selector:
    app: product-service
  ports:
    - port: 8083
      targetPort: 8083

