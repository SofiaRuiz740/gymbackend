server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: report-service
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gym_report_db}?schema=${DB_SCHEMA:reporting}
    username: ${DB_USER:gym}
    password: ${DB_PASSWORD:gym}
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gym_report_db}
    user: ${DB_USER:gym}
    password: ${DB_PASSWORD:gym}
    locations: classpath:db/migration
    schemas: ${DB_SCHEMA:reporting}
    default-schema: ${DB_SCHEMA:reporting}
    create-schemas: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:report-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.gym.shared.events
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

security:
  jwt:
    secret: ${JWT_SECRET:replace-this-with-a-very-strong-secret-32-bytes}

app:
  kafka:
    topics:
      category-events: ${KAFKA_CATEGORY_TOPIC:category.events}
      product-events: ${KAFKA_PRODUCT_TOPIC:product.events}
      inventory-movements: ${KAFKA_INVENTORY_TOPIC:inventory.movements}

